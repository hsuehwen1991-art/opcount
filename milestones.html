<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IHG Duo" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preload" as="image" href="logos/loading-cat.webp" type="image/webp" fetchpriority="high" />
  <title>進階獎勵｜IHG Duo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background-color: #f3f7fc;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(14, 165, 233, 0.10) 0%, transparent 38%),
        radial-gradient(circle at 88% 8%, rgba(99, 102, 241, 0.08) 0%, transparent 34%),
        radial-gradient(#cbd5e1 0.85px, transparent 0.85px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-attachment: fixed;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', 'Inter', monospace;
      font-variant-numeric: tabular-nums;
    }

    .tech-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.75);
      box-shadow: 0 4px 24px -6px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(14, 165, 233, 0.04);
    }

    .tech-card-hover {
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tech-card-hover:hover {
      border-color: rgba(14, 165, 233, 0.45);
      box-shadow: 0 10px 28px -8px rgba(14, 165, 233, 0.14);
      transform: translateY(-1px);
    }

    .table-container::-webkit-scrollbar { height: 7px; }
    .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

  <div id="appHeader"></div>

  <main class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-5 sm:py-6 space-y-5 sm:space-y-6">
    <div id="appControls"></div>

    <!-- 雙軌房晚明細卡 -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="tech-card rounded-2xl p-5 space-y-3">
        <div class="flex items-start sm:items-center justify-between gap-2">
          <h2 class="min-w-0 text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2 leading-snug">
            <span class="w-1.5 h-4 rounded-full bg-indigo-500 shrink-0"></span>
            <span>會籍定級房晚</span>
          </h2>
          <span id="msTierBadge" class="inline-flex items-center whitespace-nowrap shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold border bg-slate-100 text-slate-600">俱樂部會員</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span id="msStatusTotal" class="font-mono-num text-3xl font-bold text-indigo-600">0</span>
          <span class="text-xs text-slate-400">晚</span>
          <span id="msStatusGap" class="ml-auto text-right text-xs font-semibold text-slate-600"></span>
        </div>
        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center text-xs">
          <div class="rounded-xl bg-slate-50 p-2">
            <div class="text-[11px] text-slate-400">去年結轉</div>
            <div id="msRollover" class="font-mono-num font-bold text-slate-700 mt-0.5">0 晚</div>
          </div>
          <div class="rounded-xl bg-sky-50/70 p-2">
            <div class="text-[11px] text-sky-600">今年實住</div>
            <div id="msActual1" class="font-mono-num font-bold text-sky-700 mt-0.5">0 晚</div>
          </div>
          <div class="rounded-xl bg-teal-50/70 p-2">
            <div class="text-[11px] text-teal-600">活動加倍</div>
            <div id="msBonusStatus" class="font-mono-num font-bold text-teal-700 mt-0.5">0 晚</div>
          </div>
        </div>
      </div>

      <div class="tech-card rounded-2xl p-5 space-y-3">
        <div class="flex items-start sm:items-center justify-between gap-2">
          <h2 class="min-w-0 text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2 leading-snug">
            <span class="w-1.5 h-4 rounded-full bg-amber-500 shrink-0"></span>
            <span>進階獎勵房晚</span>
          </h2>
          <span id="msLoungeBadge" class="inline-flex items-center whitespace-nowrap shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold border bg-amber-50 text-amber-700 border-amber-200">衝刺中</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span id="msMilestoneTotal" class="font-mono-num text-3xl font-bold text-cyan-700">0</span>
          <span class="text-xs text-slate-400">晚（不含結轉）</span>
          <span id="msLoungeGap" class="ml-auto text-right text-xs font-semibold text-amber-700"></span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 text-center text-xs">
          <div class="rounded-xl bg-sky-50/70 p-2">
            <div class="text-[11px] text-sky-600">今年實住</div>
            <div id="msActual2" class="font-mono-num font-bold text-sky-700 mt-0.5">0 晚</div>
          </div>
          <div class="rounded-xl bg-teal-50/70 p-2">
            <div class="text-[11px] text-teal-600">活動加倍</div>
            <div id="msBonusMilestone" class="font-mono-num font-bold text-teal-700 mt-0.5">0 晚</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 定向加倍活動追蹤 -->
    <section class="tech-card rounded-2xl overflow-hidden">
      <div class="px-4 sm:px-5 py-4 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-2 bg-slate-50/50">
        <div>
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-4 rounded-full bg-teal-500 shrink-0"></span>
            定向加倍活動追蹤
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">活動格式：【IHG加倍】活動名稱（說明欄填 上限x晚 或 無上限）</p>
        </div>
        <a data-nav-href="manage.html" href="manage.html#promo" class="whitespace-nowrap shrink-0 px-3 py-1.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 text-xs font-semibold transition">
          ＋ 管理加倍活動
        </a>
      </div>
      <div id="promoListContainer" class="p-4 sm:p-5"></div>
    </section>

    <!-- 20~70 晚里程碑時間軸 -->
    <section class="tech-card rounded-2xl overflow-hidden">
      <div class="px-4 sm:px-5 py-4 border-b border-slate-200/80 bg-slate-50/50">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <span class="w-1.5 h-4 rounded-full bg-sky-500 shrink-0"></span>
          IHG One Rewards 進階獎勵里程碑
        </h2>
        <p class="text-xs text-slate-500 mt-0.5">達成門檻後須於 90 天內至 IHG 官網或 App 領取；40 晚與 70 晚可任選 2 項獎勵</p>
      </div>
      <div id="milestoneGrid" class="p-4 sm:p-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <script src="shared.js?v=6"></script>
  <script>
    function renderMilestonesPage(m) {
      if (!m) return;
      const yrEl = document.getElementById('promoYear');
      if (yrEl) yrEl.textContent = m.selectedYear;

      const tierBadge = document.getElementById('msTierBadge');
      tierBadge.className = `inline-flex items-center whitespace-nowrap shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold border ${m.currentTier.badgeCls}`;
      tierBadge.textContent = m.currentTier.name;

      document.getElementById('msStatusTotal').textContent = m.totalStatusNights;
      document.getElementById('msRollover').textContent = `${m.rolloverNights} 晚`;
      document.getElementById('msActual1').textContent = `${m.actualQualifyingNights} 晚`;
      document.getElementById('msBonusStatus').textContent = `${m.statusBonusNights} 晚`;
      document.getElementById('msStatusGap').textContent = m.toDiamond === 0
        ? '已達鑽石滿級'
        : (m.toPlatinum === 0 ? `距鑽石還差 ${m.toDiamond} 晚` : `距白金 ${m.toPlatinum} 晚 / 鑽石 ${m.toDiamond} 晚`);

      document.getElementById('msMilestoneTotal').textContent = m.totalMilestoneNights;
      document.getElementById('msActual2').textContent = `${m.actualQualifyingNights} 晚`;
      document.getElementById('msBonusMilestone').textContent = `${m.milestoneBonusNights} 晚`;

      const loungeBadge = document.getElementById('msLoungeBadge');
      const loungeGap = document.getElementById('msLoungeGap');
      if (m.toLounge === 0) {
        loungeBadge.className = 'inline-flex items-center whitespace-nowrap shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200';
        loungeBadge.textContent = '已解鎖酒廊';
        loungeGap.textContent = '已達成 40 晚行政酒廊！';
        loungeGap.className = 'ml-auto text-right text-xs font-semibold text-emerald-600';
      } else {
        loungeBadge.className = 'inline-flex items-center whitespace-nowrap shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold border bg-amber-50 text-amber-700 border-amber-200';
        loungeBadge.textContent = '衝刺中';
        loungeGap.textContent = `距行政酒廊還差 ${m.toLounge} 晚`;
        loungeGap.className = 'ml-auto text-right text-xs font-semibold text-amber-700';
      }

      // 加倍活動清單
      const promoBox = document.getElementById('promoListContainer');
      if (!m.promoStats || m.promoStats.length === 0) {
        promoBox.innerHTML = `<div class="py-6 text-center text-sm text-slate-400">本年度尚無定向加倍活動紀錄</div>`;
      } else {
        promoBox.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${m.promoStats.map(p => {
          const capText = p.unlimited ? '無上限' : `上限 ${p.cap} 晚`;
          const pct = p.unlimited ? 100 : Math.min(100, Math.round((p.grantedNights / p.cap) * 100));
          return `
            <div class="rounded-xl border border-slate-200/90 bg-white p-4 space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="font-bold text-sm text-slate-800">${IHGApp.escapeHtml(p.name)}</div>
                  <div class="font-mono-num text-xs text-slate-500 mt-0.5">${IHGApp.formatDateSlash(p.startDate)} – ${IHGApp.formatDateSlash(p.endDate)}</div>
                </div>
                <span class="whitespace-nowrap px-2 py-0.5 rounded-md text-[11px] font-semibold bg-teal-50 text-teal-700 border border-teal-200 shrink-0">
                  已送 ${p.grantedNights} 晚 / ${capText}
                </span>
              </div>
              <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-teal-500 to-cyan-500 rounded-full" style="width:${p.grantedNights > 0 ? Math.max(8, pct) : 0}%"></div>
              </div>
              <div class="flex items-center justify-between text-[11px] text-slate-400">
                <span>期間命中實住：${p.matchedNights} 晚</span>
                <span>${p.statusOnly ? '僅計入會籍定級' : '會籍與進階獎勵皆計入'}</span>
              </div>
            </div>
          `;
        }).join('')}</div>`;
      }

      // 里程碑卡片（20~70 晚）
      const grid = document.getElementById('milestoneGrid');
      grid.innerHTML = IHGApp.MILESTONE_REWARDS.map(item => {
        const unlocked = m.totalMilestoneNights >= item.nights;
        const remain = Math.max(0, item.nights - m.totalMilestoneNights);
        const cardBorder = item.highlight
          ? (unlocked ? 'border-emerald-300 bg-emerald-50/30 ring-1 ring-emerald-200' : 'border-amber-300 bg-amber-50/30 ring-1 ring-amber-200/80')
          : (unlocked ? 'border-sky-200 bg-sky-50/25' : 'border-slate-200/90 bg-white');
        const statusBadge = unlocked
          ? `<span class="whitespace-nowrap shrink-0 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">已解鎖 ✓</span>`
          : `<span class="whitespace-nowrap shrink-0 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 font-mono-num">尚差 ${remain} 晚</span>`;

        return `
          <div class="rounded-2xl border p-4 flex flex-col justify-between gap-3 ${cardBorder}">
            <div>
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-mono-num text-xl font-bold whitespace-nowrap ${unlocked ? 'text-emerald-700' : 'text-slate-800'}">${item.nights} 晚</span>
                  ${item.tag ? `<span class="whitespace-nowrap px-2 py-0.5 rounded-md text-[10px] font-bold ${item.highlight ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-700'}">${item.tag}</span>` : ''}
                </div>
                ${statusBadge}
              </div>
              <div class="text-[11px] font-semibold text-slate-500 mt-1">可任選 ${item.pickCount} 項獎勵</div>
              <ul class="mt-2.5 space-y-1.5 text-xs text-slate-700">
                ${item.options.map(opt => `
                  <li class="flex items-start gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${opt.includes('行政酒廊') ? 'bg-amber-500' : 'bg-sky-400'}"></span>
                    <span class="${opt.includes('行政酒廊') ? 'font-bold text-amber-800' : ''}">${IHGApp.escapeHtml(opt)}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        `;
      }).join('');
    }

    IHGApp.init({
      activePage: 'milestones',
      onRender({ membership }) {
        renderMilestonesPage(membership);
      }
    });
  </script>
</body>
</html>
