<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IHG Duo" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preload" as="image" href="logos/loading-cat.webp" type="image/webp" fetchpriority="high" />
  <title>住宿明細｜IHG Duo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background-color: #f3f7fc;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(14, 165, 233, 0.10) 0%, transparent 38%),
        radial-gradient(circle at 88% 8%, rgba(99, 102, 241, 0.08) 0%, transparent 34%),
        radial-gradient(#cbd5e1 0.85px, transparent 0.85px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-attachment: fixed;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', 'Inter', monospace;
      font-variant-numeric: tabular-nums;
    }

    .tech-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.75);
      box-shadow: 0 4px 24px -6px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(14, 165, 233, 0.04);
    }

    .tech-card-hover {
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tech-card-hover:hover {
      border-color: rgba(14, 165, 233, 0.45);
      box-shadow: 0 10px 28px -8px rgba(14, 165, 233, 0.14);
      transform: translateY(-1px);
    }

    .table-container::-webkit-scrollbar { height: 7px; }
    .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

  <div id="appHeader"></div>

  <main class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-5 sm:py-6 space-y-5 sm:space-y-6">
    <div id="appControls"></div>

    <section class="tech-card rounded-2xl overflow-hidden">
      <div class="px-4 sm:px-5 py-4 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-3 bg-slate-50/50">
        <div>
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-4 rounded-full bg-indigo-500"></span>
            住宿明細清單
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">共 <span id="detailCount" class="font-mono-num font-semibold text-sky-700">0</span> 筆住宿紀錄</p>
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
          <input id="searchInput" type="search" placeholder="搜尋飯店或方案..." oninput="renderDetails()"
            class="flex-1 sm:w-48 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs sm:text-sm focus:ring-2 focus:ring-sky-500/40 focus:border-sky-400 outline-none" />
          <select id="planFilter" onchange="renderDetails()"
            class="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs sm:text-sm text-slate-700 focus:ring-2 focus:ring-sky-500/40 outline-none">
            <option value="">全部方案</option>
            <option value="IHG One Pass 優享價">優享價</option>
            <option value="IHG One Pass 彈性價">彈性價</option>
            <option value="IHG One Pass 友人價">友人價</option>
            <option value="大使免費週末住宿">大使週末</option>
            <option value="獎勵住宿">獎勵住宿</option>
            <option value="__OTHER__">其他方案</option>
          </select>

          <!-- 僅手機版顯示的排序控制 -->
          <div class="md:hidden flex items-center gap-1.5 w-full">
            <select id="mobileSortKey" onchange="onMobileSortChange()"
              class="flex-1 rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs text-slate-700 outline-none">
              <option value="checkIn">排序：入住日</option>
              <option value="checkOut">排序：退房日</option>
              <option value="hotelName">排序：飯店名稱</option>
              <option value="qualifyingNights">排序：定級房晚</option>
              <option value="plan">排序：價格方案</option>
              <option value="nights">排序：員工價額度房晚</option>
              <option value="hotelLimit">排序：飯店年度限額</option>
              <option value="price">排序：價格</option>
            </select>
            <button id="mobileSortDirBtn" onclick="toggleSortDir()" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-700">
              升冪 ↑
            </button>
          </div>
        </div>
      </div>

      <!-- 電腦版表格（統一雙行高度 h-16、飯店名自動換行、積分雙行顯示） -->
      <div class="hidden md:block table-container overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50/90 text-slate-500 text-xs font-semibold border-b border-slate-200/80 whitespace-nowrap">
            <tr>
              <th onclick="sortBy('hotelName')" class="px-4 py-3 cursor-pointer hover:text-sky-700 select-none">飯店名稱 <span class="sort-ind" data-col="hotelName"></span></th>
              <th onclick="sortBy('checkIn')" class="px-3.5 py-3 cursor-pointer hover:text-sky-700 select-none">入住日 <span class="sort-ind" data-col="checkIn"></span></th>
              <th onclick="sortBy('checkOut')" class="px-3.5 py-3 cursor-pointer hover:text-sky-700 select-none">退房日 <span class="sort-ind" data-col="checkOut"></span></th>
              <th onclick="sortBy('qualifyingNights')" class="px-3.5 py-3 text-right cursor-pointer hover:text-sky-700 select-none">定級房晚 <span class="sort-ind" data-col="qualifyingNights"></span></th>
              <th onclick="sortBy('plan')" class="px-3.5 py-3 cursor-pointer hover:text-sky-700 select-none">價格方案 <span class="sort-ind" data-col="plan"></span></th>
              <th onclick="sortBy('nights')" class="px-3.5 py-3 cursor-pointer hover:text-sky-700 select-none">員工價額度房晚 <span class="sort-ind" data-col="nights"></span></th>
              <th onclick="sortBy('hotelLimit')" class="px-3.5 py-3 cursor-pointer hover:text-sky-700 select-none">飯店年度限額 <span class="sort-ind" data-col="hotelLimit"></span></th>
              <th onclick="sortBy('price')" class="px-4 py-3 text-right cursor-pointer hover:text-sky-700 select-none">價格 <span class="sort-ind" data-col="price"></span></th>
            </tr>
          </thead>
          <tbody id="detailsTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <!-- 手機版資訊卡 -->
      <div id="detailsMobileCards" class="md:hidden p-3.5 space-y-3"></div>
    </section>
  </main>

  <script src="shared.js?v=6"></script>
  <script>
    let currentYearList = [];
    let sortKey = 'checkIn';
    let sortAsc = true;

    function sortBy(key) {
      if (sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = true; }
      const sel = document.getElementById('mobileSortKey');
      if (sel) sel.value = sortKey;
      renderDetails();
    }

    function onMobileSortChange() {
      sortKey = document.getElementById('mobileSortKey').value;
      renderDetails();
    }

    function toggleSortDir() {
      sortAsc = !sortAsc;
      renderDetails();
    }

    function getSortVal(b, key) {
      switch (key) {
        case 'hotelName': return b.hotelName;
        case 'checkIn': return b.checkIn;
        case 'checkOut': return b.checkOut;
        case 'qualifyingNights': return b.qualifyingNights;
        case 'plan': return b.planInfo.rawPlan;
        case 'nights': return b.planInfo.isEmployeePlan ? b.nights : -1;
        case 'hotelLimit': {
          const m = String(b.hotelLimitDisplay).match(/(\d+)/);
          return m ? parseInt(m[1], 10) : -1;
        }
        case 'price': return b.priceInfo.twd;
        default: return b.checkIn;
      }
    }

    function formatPriceHtml(priceInfo, alignRight = true) {
      const alignCls = alignRight ? 'text-right' : 'text-left';
      if (priceInfo.isPoints) {
        return `
          <div class="${alignCls} font-mono-num leading-tight">
            <div class="font-semibold text-slate-800">${priceInfo.points.toLocaleString()} 積分</div>
            <div class="text-[11px] text-slate-400 mt-0.5">約 ${priceInfo.twd.toLocaleString()} 元</div>
          </div>
        `;
      }
      return `<div class="${alignCls} font-mono-num font-semibold text-slate-800">${priceInfo.twd.toLocaleString()} 元</div>`;
    }

    function renderDetails() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const pf = document.getElementById('planFilter').value;

      document.querySelectorAll('.sort-ind').forEach(el => {
        const c = el.getAttribute('data-col');
        el.textContent = c === sortKey ? (sortAsc ? '↑' : '↓') : '';
      });
      const dirBtn = document.getElementById('mobileSortDirBtn');
      if (dirBtn) dirBtn.textContent = sortAsc ? '升冪 ↑' : '降冪 ↓';

      const filtered = currentYearList.filter(b => {
        if (q && !b.hotelName.toLowerCase().includes(q) && !b.planInfo.rawPlan.toLowerCase().includes(q)) return false;
        if (pf === '__OTHER__') {
          if (IHGApp.PRESET_PLANS.includes(b.planInfo.basePlan)) return false;
        } else if (pf && b.planInfo.basePlan !== pf) {
          return false;
        }
        return true;
      }).sort((a, b) => {
        const va = getSortVal(a, sortKey);
        const vb = getSortVal(b, sortKey);
        const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'zh-Hant');
        return sortAsc ? cmp : -cmp;
      });

      document.getElementById('detailCount').textContent = filtered.length;
      const tbody = document.getElementById('detailsTableBody');
      const mobileEl = document.getElementById('detailsMobileCards');
      tbody.innerHTML = '';
      mobileEl.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="px-5 py-12 text-center text-slate-400">查無符合條件的住宿明細</td></tr>`;
        mobileEl.innerHTML = `<div class="py-10 text-center text-sm text-slate-400">查無符合條件的住宿明細</div>`;
        return;
      }

      filtered.forEach(b => {
        const style = IHGApp.getPlanStyle(b.planInfo.basePlan);
        const limitCls = b.hotelLimitExceeded ? 'text-rose-600 font-bold' : 'text-slate-600';

        const tr = document.createElement('tr');
        tr.className = 'h-16 hover:bg-sky-50/40 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-2 min-w-[180px] max-w-[240px]">
            <div class="flex items-center gap-2.5">
              ${IHGApp.buildBrandLogoHtml(b.hotelName, 'sm')}
              <span class="font-semibold text-slate-800 text-xs sm:text-sm leading-snug break-words">${IHGApp.escapeHtml(b.hotelName)}</span>
            </div>
          </td>
          <td class="px-3.5 py-2 font-mono-num text-xs text-slate-700 whitespace-nowrap">${IHGApp.formatDateSlash(b.checkIn)}</td>
          <td class="px-3.5 py-2 font-mono-num text-xs text-slate-700 whitespace-nowrap">${IHGApp.formatDateSlash(b.checkOut)}</td>
          <td class="px-3.5 py-2 text-right font-mono-num font-bold text-sky-700 whitespace-nowrap">${b.qualifyingNights} 晚</td>
          <td class="px-3.5 py-2 whitespace-nowrap">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${style.badge}">
              <span class="w-1.5 h-1.5 rounded-full ${style.dot}"></span>
              ${IHGApp.escapeHtml(b.planInfo.rawPlan)}
            </span>
          </td>
          <td class="px-3.5 py-2 font-mono-num text-xs text-slate-600 whitespace-nowrap">${IHGApp.escapeHtml(b.employeeQuotaDisplay)}</td>
          <td class="px-3.5 py-2 font-mono-num text-xs whitespace-nowrap ${limitCls}">${IHGApp.escapeHtml(b.hotelLimitDisplay)}</td>
          <td class="px-4 py-2 whitespace-nowrap">${formatPriceHtml(b.priceInfo, true)}</td>
        `;
        tbody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'rounded-xl border border-slate-200/90 bg-white p-3.5 shadow-sm space-y-2.5';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              ${IHGApp.buildBrandLogoHtml(b.hotelName, 'sm')}
              <div class="min-w-0">
                <div class="font-bold text-sm text-slate-800 leading-snug break-words">${IHGApp.escapeHtml(b.hotelName)}</div>
                <div class="font-mono-num text-[11px] text-slate-500 mt-0.5">${IHGApp.formatDateSlash(b.checkIn)} → ${IHGApp.formatDateSlash(b.checkOut)}（定級 ${b.qualifyingNights} 晚）</div>
              </div>
            </div>
            <div class="shrink-0 text-xs">${formatPriceHtml(b.priceInfo, true)}</div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-[11px]">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-medium border ${style.badge}">
              <span class="w-1.5 h-1.5 rounded-full ${style.dot}"></span>
              ${IHGApp.escapeHtml(b.planInfo.rawPlan)}
            </span>
            <div class="font-mono-num text-slate-500 flex items-center gap-2">
              <span>${IHGApp.escapeHtml(b.employeeQuotaDisplay)}</span>
              <span class="text-slate-300">|</span>
              <span class="${limitCls}">${IHGApp.escapeHtml(b.hotelLimitDisplay)}</span>
            </div>
          </div>
        `;
        mobileEl.appendChild(card);
      });
    }

    IHGApp.init({
      activePage: 'details',
      onRender({ selectedYear, yearBookings }) {
        const yrEl = document.getElementById('detailYear');
        if (yrEl) yrEl.textContent = selectedYear;
        currentYearList = yearBookings;
        renderDetails();
      }
    });
  </script>
</body>
</html>
