<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IHG Duo" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preload" as="image" href="logos/loading-cat.webp" type="image/webp" fetchpriority="high" />
  <title>各飯店總覽｜IHG Duo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background-color: #f3f7fc;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(14, 165, 233, 0.10) 0%, transparent 38%),
        radial-gradient(circle at 88% 8%, rgba(99, 102, 241, 0.08) 0%, transparent 34%),
        radial-gradient(#cbd5e1 0.85px, transparent 0.85px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-attachment: fixed;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', 'Inter', monospace;
      font-variant-numeric: tabular-nums;
    }

    .tech-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.75);
      box-shadow: 0 4px 24px -6px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(14, 165, 233, 0.04);
    }

    .tech-card-hover {
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tech-card-hover:hover {
      border-color: rgba(14, 165, 233, 0.45);
      box-shadow: 0 10px 28px -8px rgba(14, 165, 233, 0.14);
      transform: translateY(-1px);
    }

    .table-container::-webkit-scrollbar { height: 7px; }
    .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .table-container::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

  <div id="appHeader"></div>

  <main class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-5 sm:py-6 space-y-5 sm:space-y-6">
    <div id="appControls"></div>

    <section class="tech-card rounded-2xl overflow-hidden">
      <div class="px-4 sm:px-5 py-4 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-2 bg-slate-50/50">
        <div>
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-4 rounded-full bg-cyan-500"></span>
            各飯店年度住宿總覽
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">飯店年度限額顯示剩餘可用額度（上限 14 晚）；晚數合計以該飯店定級房晚加總計算</p>
        </div>
        <span id="hotelCountBadge" class="font-mono-num text-xs font-semibold px-2.5 py-1 rounded-lg bg-sky-50 text-sky-700 border border-sky-200/70">
          共 0 間飯店
        </span>
      </div>

      <!-- 電腦版表格 -->
      <div class="hidden md:block table-container overflow-x-auto">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead class="bg-slate-50/90 text-slate-500 text-xs font-semibold border-b border-slate-200/80">
            <tr>
              <th class="px-4 py-3">飯店名稱</th>
              <th class="px-4 py-3 text-right">IHG One Pass 優享價</th>
              <th class="px-4 py-3 text-right">IHG One Pass 彈性價</th>
              <th class="px-4 py-3 text-right">IHG One Pass 友人價</th>
              <th class="px-4 py-3 text-right">飯店年度限額</th>
              <th class="px-4 py-3 text-right">其他方案</th>
              <th class="px-4 py-3 text-right">晚數合計</th>
              <th class="px-4 py-3 text-right">住宿比</th>
            </tr>
          </thead>
          <tbody id="hotelOverviewBody" class="divide-y divide-slate-100"></tbody>
          <tfoot id="hotelOverviewFoot" class="bg-sky-50/60 font-bold text-slate-800 border-t border-sky-200/70"></tfoot>
        </table>
      </div>

      <!-- 手機版卡片 -->
      <div id="hotelMobileCards" class="md:hidden p-3.5 space-y-3"></div>
    </section>
  </main>

  <script src="shared.js?v=8"></script>
  <script>
    function renderHotelOverview(selectedYear, list) {
      const yrEl = document.getElementById('hotelOverviewYear');
      if (yrEl) yrEl.textContent = selectedYear;

      const hotelMap = {};
      let grandYouxiang = 0, grandTanxing = 0, grandYouren = 0, grandOther = 0, grandQualifyingTotal = 0;

      list.forEach(b => {
        if (!hotelMap[b.hotelName]) {
          hotelMap[b.hotelName] = {
            hotelName: b.hotelName, youxiang: 0, tanxing: 0, youren: 0, other: 0, qualifyingTotal: 0
          };
        }
        const h = hotelMap[b.hotelName];
        if (b.planInfo.basePlan === 'IHG One Pass 優享價') { h.youxiang += b.nights; grandYouxiang += b.nights; }
        else if (b.planInfo.basePlan === 'IHG One Pass 彈性價') { h.tanxing += b.nights; grandTanxing += b.nights; }
        else if (b.planInfo.basePlan === 'IHG One Pass 友人價') { h.youren += b.nights; grandYouren += b.nights; }
        else { h.other += b.nights; grandOther += b.nights; }
        h.qualifyingTotal += b.qualifyingNights;
        grandQualifyingTotal += b.qualifyingNights;
      });

      const hotels = Object.values(hotelMap)
        .map(h => ({ ...h, empSum: h.youxiang + h.tanxing + h.youren }))
        .sort((a, b) => b.qualifyingTotal - a.qualifyingTotal || b.empSum - a.empSum);

      document.getElementById('hotelCountBadge').textContent = `共 ${hotels.length} 間飯店`;

      const tbody = document.getElementById('hotelOverviewBody');
      const tfoot = document.getElementById('hotelOverviewFoot');
      const mobileEl = document.getElementById('hotelMobileCards');
      tbody.innerHTML = '';
      mobileEl.innerHTML = '';

      if (hotels.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="px-5 py-12 text-center text-slate-400">該年度尚無符合條件的住宿紀錄</td></tr>`;
        tfoot.innerHTML = '';
        mobileEl.innerHTML = `<div class="py-10 text-center text-sm text-slate-400">該年度尚無符合條件的住宿紀錄</div>`;
        return;
      }

      const fmtCell = val => val > 0 ? `<span class="text-slate-800 font-semibold">${val} 晚</span>` : `<span class="text-slate-300">0 晚</span>`;

      hotels.forEach(h => {
        const rem = IHGApp.HOTEL_ANNUAL_CAP - h.empSum;
        const ratio = grandQualifyingTotal > 0 ? ((h.qualifyingTotal / grandQualifyingTotal) * 100).toFixed(2) : '0.00';

        let limitHtml;
        if (rem < 0) limitHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">超額${Math.abs(rem)}晚</span>`;
        else if (rem <= 3) limitHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">餘 ${rem} 晚</span>`;
        else limitHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold bg-sky-50 text-sky-700 border border-sky-200/80">餘 ${rem} 晚</span>`;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-sky-50/40 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-3 font-semibold text-slate-800">
            <div class="flex items-center gap-2.5">${IHGApp.buildBrandLogoHtml(h.hotelName, 'sm')}<span>${IHGApp.escapeHtml(h.hotelName)}</span></div>
          </td>
          <td class="px-4 py-3 text-right font-mono-num">${fmtCell(h.youxiang)}</td>
          <td class="px-4 py-3 text-right font-mono-num">${fmtCell(h.tanxing)}</td>
          <td class="px-4 py-3 text-right font-mono-num">${fmtCell(h.youren)}</td>
          <td class="px-4 py-3 text-right font-mono-num">${limitHtml}</td>
          <td class="px-4 py-3 text-right font-mono-num">${fmtCell(h.other)}</td>
          <td class="px-4 py-3 text-right font-mono-num font-bold text-sky-700">${h.qualifyingTotal} 晚</td>
          <td class="px-4 py-3 text-right font-mono-num font-medium text-slate-600">${ratio}%</td>
        `;
        tbody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'rounded-xl border border-slate-200/90 bg-white p-3.5 shadow-sm space-y-3';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              ${IHGApp.buildBrandLogoHtml(h.hotelName, 'sm')}
              <div class="min-w-0">
                <div class="font-bold text-sm text-slate-800 leading-snug break-words">${IHGApp.escapeHtml(h.hotelName)}</div>
                <div class="text-[11px] text-slate-500 mt-0.5 font-mono-num">定級合計 <strong class="text-sky-700">${h.qualifyingTotal} 晚</strong> ・ 佔比 ${ratio}%</div>
              </div>
            </div>
            <div class="shrink-0">${limitHtml}</div>
          </div>
          <div class="grid grid-cols-4 gap-1.5 text-center bg-slate-50/90 rounded-lg p-2 border border-slate-100 text-[11px]">
            <div><div class="text-slate-400">優享</div><div class="font-mono-num font-bold text-sky-700 mt-0.5">${h.youxiang}晚</div></div>
            <div><div class="text-slate-400">彈性</div><div class="font-mono-num font-bold text-teal-700 mt-0.5">${h.tanxing}晚</div></div>
            <div><div class="text-slate-400">友人</div><div class="font-mono-num font-bold text-indigo-700 mt-0.5">${h.youren}晚</div></div>
            <div><div class="text-slate-400">其他</div><div class="font-mono-num font-bold text-slate-600 mt-0.5">${h.other}晚</div></div>
          </div>
        `;
        mobileEl.appendChild(card);
      });

      tfoot.innerHTML = `
        <tr>
          <td class="px-4 py-3.5 text-slate-800">總計</td>
          <td class="px-4 py-3.5 text-right font-mono-num">${grandYouxiang} 晚</td>
          <td class="px-4 py-3.5 text-right font-mono-num">${grandTanxing} 晚</td>
          <td class="px-4 py-3.5 text-right font-mono-num">${grandYouren} 晚</td>
          <td class="px-4 py-3.5 text-right text-slate-400">—</td>
          <td class="px-4 py-3.5 text-right font-mono-num">${grandOther} 晚</td>
          <td class="px-4 py-3.5 text-right font-mono-num text-sky-700">${grandQualifyingTotal} 晚</td>
          <td class="px-4 py-3.5 text-right font-mono-num">100.00%</td>
        </tr>
      `;

      const sumCard = document.createElement('div');
      sumCard.className = 'rounded-xl border border-sky-200 bg-sky-50/80 p-3.5 space-y-2';
      sumCard.innerHTML = `
        <div class="flex items-center justify-between text-xs font-bold text-sky-900">
          <span>年度總計（${hotels.length} 間飯店）</span>
          <span class="font-mono-num text-sm text-sky-700">定級 ${grandQualifyingTotal} 晚 (100%)</span>
        </div>
        <div class="grid grid-cols-4 gap-1.5 text-center text-[11px] font-mono-num text-slate-700">
          <div>優享 ${grandYouxiang}晚</div>
          <div>彈性 ${grandTanxing}晚</div>
          <div>友人 ${grandYouren}晚</div>
          <div>其他 ${grandOther}晚</div>
        </div>
      `;
      mobileEl.appendChild(sumCard);
    }

    IHGApp.init({
      activePage: 'hotels',
      onRender({ selectedYear, yearBookings }) {
        renderHotelOverview(selectedYear, yearBookings);
      }
    });
  </script>
</body>
</html>
